name: weekly-report
on:
  schedule:
    - cron: "0 2 * * 1" # Monday 02:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.ts
      # Measured 04/11/2026: a full week takes about 2,000 API requests and 10 minutes. If the token's
      # hourly limit runs out, the client waits for the reset; the 180-minute timeout leaves room for that.
      - run: node src/cli.ts --days 7
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit the new report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "chore: weekly CI health report"
          git push
